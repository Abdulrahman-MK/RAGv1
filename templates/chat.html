<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHIS RAG Assistant - GAHAR 2025</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .chat-container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .chat-header {
            background: #007bff;
            color: white;
            padding: 1rem;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            text-align: center;
        }
        .chat-body {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 80%;
            padding: 0.8rem 1rem;
            border-radius: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message p:last-child {
            margin-bottom: 0;
        }
        .message ul, .message ol {
            margin-bottom: 0.5rem;
        }
        .message.user {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .message.bot {
            background-color: #e9ecef;
            color: #212529;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .chat-input-container {
            padding: 1rem;
            border-top: 1px solid #dee2e6;
            background: white;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .spinner-border {
            width: 1.5rem;
            height: 1.5rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="chat-container">
        <div class="chat-header">
            <h4>IHIS RAG Assistant</h4>
            <small>GAHAR Hospital Accreditation Standards 2025</small>
        </div>
        
        <div class="chat-body" id="chatBody">
            <div class="message bot" dir="ltr">
                Hello! I am the IHIS Assistant. Ask me anything about the GAHAR 2025 Standards (English or Arabic).<br>
                مرحباً! أنا مساعد IHIS. اسألني أي شيء عن معايير جهار 2025.
            </div>
        </div>

        <div class="chat-input-container">
            <form id="chatForm" class="d-flex gap-2">
                <input type="text" id="userInput" class="form-control" placeholder="Type your message..." autocomplete="off" required>
                <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" id="sendBtn">
                    <span>Send</span>
                    <div class="spinner-border text-light" role="status" id="loadingSpinner">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const chatBody = document.getElementById('chatBody');
    const sendBtn = document.getElementById('sendBtn');
    const loadingSpinner = document.getElementById('loadingSpinner');

    // Simple heuristic to detect Arabic text
    function isArabic(text) {
        const arabicPattern = /[\u0600-\u06FF]/;
        return arabicPattern.test(text);
    }

    // Auto-adjust input direction
    userInput.addEventListener('input', function() {
        if (isArabic(this.value)) {
            this.setAttribute('dir', 'rtl');
        } else if (this.value.trim() !== '') {
            this.setAttribute('dir', 'ltr');
        } else {
            this.removeAttribute('dir');
        }
    });

    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        
        if (sender === 'bot') {
            msgDiv.innerHTML = marked.parse(text);
        } else {
            msgDiv.innerText = text;
        }
        
        // Set RTL if Arabic detected
        if (isArabic(text)) {
            msgDiv.setAttribute('dir', 'rtl');
            if(sender === 'bot') {
                msgDiv.style.alignSelf = 'flex-end'; // Align bot messages to the right if Arabic
                msgDiv.style.borderBottomLeftRadius = '15px';
                msgDiv.style.borderBottomRightRadius = '0';
            } else {
                msgDiv.style.alignSelf = 'flex-start'; // Align user messages to the left if Arabic
                msgDiv.style.borderBottomRightRadius = '15px';
                msgDiv.style.borderBottomLeftRadius = '0';
            }
        } else {
            msgDiv.setAttribute('dir', 'ltr');
        }

        chatBody.appendChild(msgDiv);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();
        if (!message) return;

        // Add user message
        addMessage(message, 'user');
        userInput.value = '';
        userInput.removeAttribute('dir');

        // UI state
        userInput.disabled = true;
        sendBtn.disabled = true;
        loadingSpinner.style.display = 'inline-block';
        sendBtn.querySelector('span').style.display = 'none';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message })
            });

            const data = await response.json();
            
            if (response.ok) {
                addMessage(data.response, 'bot');
            } else {
                addMessage('Error: ' + (data.error || 'Something went wrong.'), 'bot');
            }
        } catch (error) {
            addMessage('Network Error: Could not reach the server.', 'bot');
        } finally {
            // Reset UI state
            userInput.disabled = false;
            sendBtn.disabled = false;
            loadingSpinner.style.display = 'none';
            sendBtn.querySelector('span').style.display = 'inline';
            userInput.focus();
        }
    });
</script>
</body>
</html>
